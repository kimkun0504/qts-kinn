[project]
name = "kinn"
version = "0.1.0"
description = "Kinn: a research platform for intraday equity strategies."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "numpy>=2.5.4",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
kinn = "kinn.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "import-linter>=2.1",
    "pre-commit>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kinn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "."]
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

# Import rules (ARCHITECTURE.md, rule 1). Run with `uv run lint-imports`.
[tool.importlinter]
root_packages = ["kinn", "strategies", "apps"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The platform never imports strategies, apps or the research sandbox"
type = "forbidden"
source_modules = ["kinn"]
forbidden_modules = ["strategies", "apps", "research"]

[[tool.importlinter.contracts]]
name = "Nothing imports the research sandbox"
type = "forbidden"
source_modules = ["strategies", "apps"]
forbidden_modules = ["research"]

[[tool.importlinter.contracts]]
name = "Apps never import strategy code"
type = "forbidden"
source_modules = ["apps"]
forbidden_modules = ["strategies"]

[[tool.importlinter.contracts]]
name = "kinn.core depends on no other part of the platform"
type = "forbidden"
source_modules = ["kinn.core"]
forbidden_modules = [
    "kinn.data",
    "kinn.features",
    "kinn.costs",
    "kinn.risk",
    "kinn.engine",
    "kinn.validation",
    "kinn.registry",
    "kinn.reporting",
    "kinn.cli",
]
