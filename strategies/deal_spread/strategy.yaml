record:
  title: Companies being acquired
  idea: Holding a takeover target to the close of the deal
  horizon: 1 to 6 months
  verdict: closed
  result: "0.3% to 1% a trade; 2% to 8% a year on the money, with losses of 35% to 95%"
  summary: >-
    A stock under an agreed takeover trades a little under the offer until the deal closes.
    Buy after the tender-offer or merger filing and hold to the close.
  weaknesses:
    - By the filing most of the gap has closed; what is left pays about what cash earns.
    - A failed deal costs 35% to 95% of the position.
