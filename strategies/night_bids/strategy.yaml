record:
  title: Resting bids after hours
  idea: Leaving small buy orders below the market after hours
  horizon: Overnight
  verdict: planned
  summary: >-
    The owner's idea. After 16:00 almost nobody quotes, so a hurried seller can push a stock
    down several percent on a few thousand dollars. A small buy order left below the close is
    filled by such a seller and sold at the next open.
