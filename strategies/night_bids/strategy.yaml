record:
  title: Resting bids after hours
  idea: Leaving small buy orders below the market after hours
  horizon: Overnight
  verdict: closed
  result: "Loses 1% to 8% a trade: the after-hours seller has read the news"
  summary: >-
    The owner's idea. After 16:00 almost nobody quotes, so a small buy order left below the
    close might be paid for being there. Also tried: trading with an after-hours move once it
    shows, in either direction.
  weaknesses:
    - A resting buy order is filled on the way down by news told in a press release before any SEC filing; single fills lost 50% to 87%.
    - Following the move loses too: about a tenth of an after-hours move is given back by the next open.
    - No after-hours quotes on disk; fills are read from trades by the minute.
