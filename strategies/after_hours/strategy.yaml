name: after_hours
kind: swing               # research script first; no runner yet
status: event-study       # nothing passed both tests in 105 trials; three leads in REPORT.md
engine: intraday
universe: listed common stock, market value >= $50M, 20-day dollar volume >= $250k, traded outside regular hours after results
family: after_hours
prior_trials: 129
cost_calibration: ibkr_pro_tiered
owner: claude

record:
  title: Trading after hours on results
  idea: Trading the after-hours reaction to results
  horizon: Overnight to 15 sessions
  verdict: weak
  label: "Leads, not passed"
  result: "Short after a 15% fall after hours ($300M to $2B): positive in all 10 test years and +6.7% a trade in 2023; not passed"
  summary: >-
    The owner's idea. Half an hour after results released after the close, trade in
    after-hours at the worst price of the minute: buy a rise, or sell short a fall, and close
    at the next open or later.
  weaknesses:
    - Nothing passed both tests in 105 trials; every long cell lost in 2020 or 2021, the short side failed on steadiness since 2018.
    - Indicators of our own (pressure, hold) sorted the years to 2017 and not the years since; a resting order was no better than paying the minute's high.
    - No after-hours quotes on disk, so the price a small order would get is assumed.
    - Borrow and short-sale rules after hours at a retail broker are not checked; single shorts lost 20% to 35% overnight.
  waiting:
    - "After-hours short (on paper since 2026-11-19): run tools/owner/paper_after_hours.py each morning after 09:35, and record what IBKR shows to borrow on each signal with --borrow."
  evidence:
    - {when: 2026-11-17, title: Long side, kind: found, text: "Up 5% to 15% after hours kept rising: +0.9% to the next open, +2.5% in 15 sessions (2010 to 2017). Five cells met the bar."}
    - {when: 2026-11-17, title: Long side tested, kind: failed, text: "None passed both. Mid to the next open worked in 14 of 15 years to 2019 and lost in 2020 to 2022."}
    - {when: 2026-11-17, title: Short side, kind: found, text: "$300M to $2B down 15% or more: +2.8% to the next open, +3.4% to the next close (2010 to 2017)."}
    - {when: 2026-11-17, title: Short side tested, kind: open, text: "2005 to 2009 passed (+3.0%, +4.4%). 2018 to 2022 positive every year (+1.6%, +2.1%) but the t misses. Not passed."}
    - {when: 2026-11-17, title: Indicators and a resting order, kind: failed, text: "Pressure and hold worked to 2017 only. A resting order fills on the weaker stocks. 49 more trials, nothing passed."}
  studies:
    - {name: After-hours and premarket entries after results, when: 2026-11-17, trials: 40, result: "An overnight gain in 15 of 19 years, lost 2020 to 2022; large companies for 15 sessions a near miss", verdict: lead}
    - {name: Selling short after hours on a bad report, when: 2026-11-17, trials: 16, result: "Down 15%+, $300M to $2B: +1.6% to +3.0% overnight in every test year; t too low since 2018", verdict: lead}
    - {name: Pressure and hold indicators, when: 2026-11-17, trials: 27, result: "Six cells met the search bar, none passed 2018 to 2022", verdict: failed}
    - {name: A resting order at the reading price, when: 2026-11-17, trials: 20, result: "No better than the minute's high; $2B+ for 15 sessions 1.2% to 1.5% in all periods, missed on the t", verdict: lead}
    - {name: The short's neighbours held to 15:30, when: 2026-11-17, trials: 4, result: "All four positive in 7 of 8 years (+0.8% to +1.5%), none meets the bar", verdict: note}
    - {name: A rebound after the short's events, when: 2026-11-17, trials: 2, result: "None: −0.50% in 5 sessions, +0.19% in 10", verdict: failed}
    - {name: Who sells after hours (footprint split), when: 2026-11-18, trials: 1, result: "Large pieces better to 2017, worse since; not a filter", verdict: failed}
    - {name: Who buys after hours (footprint split), when: 2026-11-18, trials: 1, result: "Large pieces worse for the large-company long; not a filter", verdict: failed}
    - {name: Who buys after hours in small companies, when: 2026-11-18, trials: 2, result: "Large pieces better in every period (+5.4%, +6.1%, +9.9%; 2023 +7.6%); 10 to 16 trades a year, t 1.0 to 2.8, thin fills; with $5,000+ entry minutes the median is near zero outside 2010–17", verdict: lead}
    - {name: The same signal bought at the next open, when: 2026-11-18, trials: 1, result: "Large pieces +4.3%, +5.1%, +8.5% (2023 +7.0%), better than the whole cell in every period; ~10 trades a year, t under 2.5", verdict: lead}
    - {name: Its overlap with A50, when: 2026-11-18, trials: 1, result: "35–40% become A50 signals and make 7–17%; the rest −2.7%, +3.4%, +5.5%, +0.1%: mostly A50 a day early", verdict: note}
    - {name: Who buys after hours in mid-sized companies, when: 2026-11-18, trials: 1, result: "Not a filter; the cell is flat outside 2010–2017", verdict: failed}
    - {name: The evening version of A50's jump, when: 2026-11-18, trials: 1, result: "8 to 23 a period; worse in 2005–2009 and 2023; not a filter", verdict: failed}
    - {name: Later buy-backs for the short, when: 2026-11-17, trials: 2, result: "Bought back at 15:30: +4.55%, +3.47%, +2.37% (t 2.10), 2023 +8.82%; better than the open in every period", verdict: lead}
    - {name: The short before the open, when: 2026-11-17, trials: 3, result: "Same direction ($2B+ +2.87%, 7 of 7 years) on too few signals", verdict: failed}
    - {name: Harsher fills for the short, when: 2026-11-17, trials: 2, result: "Thin minutes do not matter; the worst of five minutes leaves 0.7% in 2018 to 2022", verdict: note}
    - {name: The 2023 check (leads_2023), when: 2026-11-17, trials: 2, result: "Short +6.66% on 44 trades; the large-company long −0.85% (contradicted)", verdict: lead}
    - {name: The large-company cell hedged with SPY, when: 2026-11-17, trials: 2, result: "1.08% a trade, seven years of eight, weekly t 2.80: under the search bar", verdict: failed}
