    - {name: Fill measurement from ticks, when: 2026-11-16, trials: 0, result: "Crosses in 99% of entries and 93% of exits, within 0.1% of the quotes", verdict: passed}
    - {name: Entries and exits, when: 2026-11-16, trials: 23, result: "The 20-day-average exit beat the plain exit on every measure set beforehand", verdict: lead}
    - {name: "The flat years: which signals fail", when: 2026-11-16, trials: 210, result: "Fallen, cash-rich companies make nothing; skipping them leaves no losing year on read years", verdict: lead}
