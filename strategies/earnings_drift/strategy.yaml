    - {when: 2026-11-16, title: Test years passed, kind: passed, text: "2005 to 2009, never used in the search: 4.49% a trade, five years of five."}
    - {when: 2026-11-16, title: 2023 check passed, kind: passed, text: "63 trades at 5.95%."}
    - {when: 2026-11-16, title: Holdout passed, kind: passed, text: "Run once by the owner: 266 trades at 5.04%, $26,716."}
    - {when: 2026-11-16, title: Fills measured, kind: passed, text: "Ticks for 150 trades: the auction prices are real and fair."}
    - {when: 2026-11-16, title: Paper ledger started, kind: running, text: "Every signal is followed; five books side by side."}
    - {when: 2026-11-16, title: Quality test found, kind: open, text: "Removes the flat years on 2005 to 2023. Unproven: found on years already read."}
    - {when: 2026-11-17, title: An unseen season checked, kind: open, text: "Autumn 2004: 19 kept signals at 12.8% each. Consistent, too few to prove it."}
  studies:
