name: earnings_drift
kind: swing               # a daily event rule run by `kinn swing` (kinn.swing_run), not an intraday strategy
status: developing        # passed its one holdout run 2026-11-16; fills measured from ticks; not yet traded; see REPORT.md
family: swing_search
prior_trials: 12306      # 12,017 in the search; about 290 since the holdout (23 exits, about 230 in the flat-years study, 12 on intraday entry, 4 on the timed rule, 8 on position counts and sizes)
cost_calibration: ibkr_pro_tiered
owner: claude

# What the Workbench shows for this strategy (apps/workbench reads this block; docs/NEW_STRATEGY.md).
record:
  title: Earnings drift
  idea: Earnings drift in small companies
  horizon: 15 sessions
  verdict: passed_holdout
  result: "Holdout: +5.04% a trade, $26,716 on $20,000"
  summary: >-
    A company worth $50M to $300M reports earnings. If its two-day return is 15% or more on
    at least five times normal volume, buy at the next open and sell at the close 15 sessions
    later. Ten positions of $2,000.
  short: >-
    Buy a company worth $50M to $300M after it jumps 15% on earnings with five times its
    normal volume. Hold 15 sessions.
  paper: earnings_drift
  periods:
    - {key: holdout, label: Holdout, config: holdout, note: "9 Nov 2023 to 6 Nov 2026, run once on 16 Nov 2026"}
    - {key: search, label: Search years, config: research, note: "2010 to 2022, the years the rule was found on"}
    - {key: test, label: Test years, config: early, note: "2005 to 2009, tested after the rule was fixed"}
  chart_note: >-
    Separate runs joined end to end. January to October 2023 was not run for this rule and
    is drawn flat.
  fills: "Opening cross in 99% of entries, closing cross in 93% of exits (ticks for 150 trades)"
  weaknesses:
    - "2026 was flat: +0.1% a trade."
    - About half the trades lose; a few large winners carry it.
    - It tops out near $20,000 to $25,000 of profit a year, because the stocks are small.
    - Not yet traded with real orders.
  variants_note: 10 positions, 2006 to 2023
  variants:
    - {rule: The frozen rule, evidence: Passed holdout, a_year: 4974, sharpe: 1.05, drawdown: 10113, worst_year: 209}
    - {rule: With the quality test, evidence: "Unproven, in paper", a_year: 5097, sharpe: 1.13, drawdown: 10366, worst_year: 1929}
    - {rule: Quality test and 20-day exit, evidence: "Unproven, in paper", a_year: 5783, sharpe: 1.30, drawdown: 7601, worst_year: 1161}
  variants_footnote: >-
    The quality test skips companies with more cash than debt whose stock is down over the
    past year. It was found after the holdout was spent.
  in_test:
    - title: Quality test on the earnings drift
      verdict: testing
      label: "Unproven, in paper"
      result: "2005 to 2023: 4.9% a trade, no losing year. Found on years already read"
      summary: >-
        Skip a signal when the company holds more cash than debt and its stock is down over
        the past year. Found after the holdout was spent.
      stats:
        - {label: "A trade, 2005 to 2023", value: "4.9%"}
        - {label: Losing years, value: 0 of 18}
        - {label: Worst drawdown, value: "$10,366"}
      settle:
        - {text: "Paper books with the test. Years of signals would be needed to be sure.", state: running}
        - {text: "One run on the holdout, a second look. Suggestive at best; the owner's decision, not taken.", state: open}
  waiting:
    - Run the paper ledger after the close each evening.
    - Decide whether to run the quality test on the holdout.
  evidence:
